name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build .\TokenGauge.slnx --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Publish single-file executable
        run: >
          dotnet publish .\src\TokenGauge.csproj
          -p:PublishProfile=win-x64-single-file
          -p:ContinuousIntegrationBuild=true
          --output .\artifacts\ci

      # Uploaded as the bare exe rather than zipped; the download is named TokenGauge.exe.
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          path: .\artifacts\ci\TokenGauge.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
